<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doc Topic</title>
    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        background: #f5f5f5;
        color: #333;
        font-family: Inter, Arial, sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .doc-shell {
        width: min(1100px, calc(100% - 32px));
        padding: 48px 24px;
        background: #fff;
        border: 1px solid #d9d9d9;
        border-radius: 18px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.04);
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 4vw, 3rem);
        letter-spacing: -0.04em;
      }
      p {
        margin: 0;
        line-height: 1.7;
        font-size: 1rem;
      }
    </style>
  </head>
  <body>
    <main class="doc-shell">
      <h1>Topic Content</h1>
      <p>The author footer card has been removed from this page and is no longer rendered.</p>
    </main>
  </body>
</html>
